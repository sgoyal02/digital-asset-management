version: "3.9"

services:

  postgres:
    image: postgres:18
    container_name: postgres_db
    env_file:
      - ./postgres.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ./minio.env
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    #environment: rmoeve as rabbitmq container not use RABBITMQ_URL, only in api env file
    ports:
      - "5672:5672"    #app-connect
      - "15672:15672"  #ui
    volumes:
      # - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_data:/var/lib/rabbitmq/mnesia
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: api
    ports:
      - "5000:5000"
    environment:
      CI: "true"
    env_file:
      - ../apps/api/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      # - ..:/app
      # - /app/node_modules
      - ../apps/api:/app/apps/api
      - api_node_modules:/app/apps/api/node_modules
    command: sh -c "cd apps/api && pnpm install && pnpm exec prisma migrate deploy && pnpm dev"
    # command: sh -c "cd apps/api && pnpm exec prisma migrate deploy && pnpm dev"
    # command: pnpm --filter api dev

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: web
    ports:
      - "5173:5173"
    environment:
      CI: "true"
      CHOKIDAR_USEPOLLING: true
    env_file:
      - ../apps/web/.env
    depends_on:  #as not need backend to start, only need apis at run tym
      - api
    volumes:
      # - ..:/app
      # - /app/node_modules
      - ../apps/web:/app/apps/web
      - web_node_modules:/app/apps/web/node_modules

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
  api_node_modules:
  web_node_modules: